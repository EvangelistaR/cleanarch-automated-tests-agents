name: Testes - Lab 02
on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar
        run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Jest e cobertura
        run: npm run test:coverage
      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-testes
          path: |
            coverage/
            reports/cucumber.html
            reports/cucumber.json
          if-no-files-found: warn
