name: CI

on:
  push:
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Jest com cobertura
        run: npm run test:coverage
      - name: Cenários BDD (Cucumber)
        run: npm run test:bdd:full
      - name: Build Next.js
        run: npm run build
      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-testes
          path: |
            coverage/
            reports/cucumber.html
            reports/cucumber.json
          if-no-files-found: warn
